<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C&R SPACE</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />

    <!-- Google Analytics (GA4) — C&R SPACE / 측정 ID: G-5LDWYN4JGP -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5LDWYN4JGP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());

      var GA_ID  = 'G-5LDWYN4JGP';                          // GA4 측정 ID
      var isProd = location.hostname === 'space.cnrres.com'; // 운영 도메인에서만 수집 (로컬/프리뷰 데이터 오염 방지)

      // 해시 라우팅 대응: 자동 page_view 끄고 수동 전송 → 화면 전환별 중복 집계 없음
      gtag('config', GA_ID, { send_page_view: false });

      var GA_TITLES = { home: '홈', calendar: '캘린더', mypage: '마이페이지', admin: '관리자' };

      function gaCurrentView() {
        // #admin-tab-bookings, #booking-123 등 세부 해시도 첫 토큰으로 정규화
        var h = (location.hash || '#home').replace('#', '').split('-')[0];
        return ['home', 'calendar', 'mypage', 'admin'].indexOf(h) >= 0 ? h : 'home';
      }
      function gaSendPageView() {
        if (!isProd) return;                                 // 운영 도메인 외에는 전송하지 않음
        var v = gaCurrentView();
        gtag('event', 'page_view', {
          page_path: '/' + v,
          page_location: location.href,
          page_title: 'C&R Space · ' + (GA_TITLES[v] || '홈')
        });
      }

      gaSendPageView();                                      // 최초 진입 1회
      window.addEventListener('hashchange', gaSendPageView); // 화면 전환마다
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
